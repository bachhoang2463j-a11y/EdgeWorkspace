<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeWorkspace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 主抽屉面板 -->
  <div class="drawer">

    <!-- 顶部 Header -->
    <div class="drawer-header">
      <div class="header-left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
        </svg>
        <span class="header-title">临时工作区</span>
        <span class="header-badge" id="totalBadge">0 项</span>
      </div>
      <div class="header-actions">
        <button class="action-btn" id="btnOpenFolder" title="在资源管理器中打开 (拖入/删除)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </button>
        <button class="action-btn" id="btnRefresh" title="刷新文件列表">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
        </button>
        <button class="action-btn" id="btnSelect" title="批量选择（拖动=整组移动，可批量移入抽屉/删除）">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </button>
        <button class="action-btn" id="btnSettings" title="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="action-btn" id="btnPin" title="固定常驻 / 移出自动收起">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
        </button>
      </div>
    </div>

    <!-- 分类 Tab 栏（v2：抽屉即文件夹，独立"文件夹"Tab 已移除） -->
    <div class="category-tab-bar" id="tabBar">
      <div class="tab-item active" data-tab="all">全部</div>
      <div class="tab-item" data-tab="image">🖼️ 图片</div>
      <div class="tab-item" data-tab="video">🎬 视频</div>
      <div class="tab-item" data-tab="doc">📄 文档</div>
      <div class="tab-item" data-tab="whiteboard">📋 白板</div>
    </div>

    <!-- 文件区（v2：分组容器，各组内为 4 列网格） -->
    <div class="drawer-content">
      <div id="fileGrid"></div>
      <div class="note-wall" id="noteWall" style="display:none;"></div>
    </div>

    <!-- 设置面板（覆盖整个抽屉；分组行结构为 P12 预留扩展） -->
    <div class="settings-panel" id="settingsPanel" hidden>
      <div class="settings-header">
        <span class="settings-title">设置</span>
        <button class="sb-btn" id="btnSettingsClose">关闭</button>
      </div>
      <div class="settings-body">
        <div class="settings-hint">当前无设置项。后续版本将加入：回收站策略以外的 工作区路径、默认排序、开机自启等。</div>
      </div>
    </div>

    <!-- P9: 批量选择操作条（选择模式时显示） -->
    <div class="select-bar" id="selectBar" hidden>
      <button class="sb-btn" id="selAll">全选</button>
      <button class="sb-btn sb-danger" id="selDelete">删除</button>
      <select class="sb-select" id="selTarget"></select>
      <button class="sb-btn sb-primary" id="selMove">移入</button>
      <button class="sb-btn" id="selDone">完成</button>
    </div>

    <!-- 底部状态栏 -->
    <div class="drawer-footer">
      <span class="footer-action-text">拖入文件 = 移入工作区</span>
      <span>Ctrl+Shift+Z 唤出 · 滚轮翻页 · 右键菜单</span>
    </div>
  </div>

<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
