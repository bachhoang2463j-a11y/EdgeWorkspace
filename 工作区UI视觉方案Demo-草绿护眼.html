<!DOCTYPE html>
<html lang="zh-CN" data-theme="nature-glass">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeWorkspace 优雅植萃·草绿护眼视觉 Demo (参考花笺)</title>
    <style>
        /* ==================== 1. 调色盘重构：优雅植萃·柔和无感·低饱和护眼 ==================== */
        :root {
            --font-main: "Segoe UI Variable Text", "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", sans-serif;
            --font-mono: ui-monospace, "Cascadia Code", Consolas, monospace;

            /* 核心品牌草木绿（温润而不刺眼） */
            --primary: #16a34a;
            --primary-hover: #15803d;
            --primary-light: rgba(22, 163, 74, 0.08);
            --primary-glow: rgba(22, 163, 74, 0.2);
        }

        /* 🍃 风格 A：晨露薄竹 (Nature Acrylic - 通透柔光·无感分隔) */
        html[data-theme="nature-glass"] {
            /* 告别发黄发浑，采用透光微绿奶白底色 */
            --bg-drawer: rgba(248, 252, 249, 0.78);
            --blur-drawer: blur(36px) saturate(140%);
            --border-drawer: 1px solid rgba(255, 255, 255, 0.85);
            --shadow-drawer: -16px 0 48px rgba(15, 30, 18, 0.14), inset 1px 0 0 rgba(255, 255, 255, 0.95);

            --bg-header: rgba(255, 255, 255, 0.4);
            --bg-tabbar: rgba(255, 255, 255, 0.3);
            --bg-footer: rgba(255, 255, 255, 0.45);

            /* 卡片无框化 */
            --bg-card: transparent;
            --bg-card-hover: rgba(255, 255, 255, 0.7);
            --border-card: transparent;
            --border-card-hover: rgba(255, 255, 255, 0.95);
            --shadow-card: none;
            --shadow-card-hover: 0 6px 18px rgba(15, 30, 18, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.95);

            /* 重点修复：去掉了刺眼的荧光绿线，采用优雅通透的纯白微光渐变分隔线 (参考图二无感线) */
            --divider-gradient: linear-gradient(90deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.2) 65%, transparent 100%);
            --border-bottom-subtle: 1px solid rgba(0, 0, 0, 0.05);

            --text-main: #0f2412;
            --text-sub: #415a45;
            --text-muted: #728c76;

            --tab-active-bg: rgba(255, 255, 255, 0.92);
            --tab-active-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            --input-bg: rgba(255, 255, 255, 0.75);
            --input-border: rgba(0, 0, 0, 0.08);

            --preview-bg: rgba(248, 252, 249, 0.9);
        }

        /* 🍵 风格 B：润目温茶 (Nature Solid - 柔光暖白实色纸质) */
        html[data-theme="nature-solid"] {
            --bg-drawer: #f7f9f7;
            --blur-drawer: none;
            --border-drawer: 1px solid #e3e8e3;
            --shadow-drawer: -10px 0 32px rgba(0, 0, 0, 0.06);

            --bg-header: #ffffff;
            --bg-tabbar: #f2f5f2;
            --bg-footer: #f2f5f2;

            /* 卡片无框化 */
            --bg-card: transparent;
            --bg-card-hover: #eaf0ea;
            --border-card: transparent;
            --border-card-hover: #dbe4dc;
            --shadow-card: none;
            --shadow-card-hover: 0 4px 12px rgba(0, 0, 0, 0.04);

            /* 柔和中性灰绿渐变线 */
            --divider-gradient: linear-gradient(90deg, rgba(0, 0, 0, 0.09) 0%, rgba(0, 0, 0, 0.02) 65%, transparent 100%);
            --border-bottom-subtle: 1px solid #e8ede8;

            --text-main: #142817;
            --text-sub: #435b46;
            --text-muted: #788e7b;

            --tab-active-bg: #ffffff;
            --tab-active-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            --input-bg: #ffffff;
            --input-border: #cbd7cc;

            --preview-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-main);
            height: 100vh;
            background: #142817 url('https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=2200&q=85') center/cover no-repeat fixed;
            overflow: hidden;
            display: flex;
            justify-content: flex-end;
            transition: background 0.5s ease;
        }

        /* ==================== 2. 左上角控制台 ==================== */
        .demo-control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 350px;
            background: rgba(15, 28, 17, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px 18px;
            color: #f0fdf4;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
            z-index: 1000;
        }

        .control-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #86efac;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .style-switch-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .style-switch-btn {
            border: none;
            background: transparent;
            color: #bbf7d0;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .style-switch-btn.active {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(22, 163, 74, 0.4);
        }

        .wallpaper-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wp-btn {
            flex: 1;
            font-size: 11px;
            padding: 5px 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #dcfce7;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }
        .wp-btn:hover, .wp-btn.active {
            background: rgba(74, 222, 128, 0.25);
            border-color: #86efac;
            color: #fff;
        }

        .edge-tip {
            margin-top: 12px;
            font-size: 11px;
            color: #86efac;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-btn {
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #fff;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        .toggle-btn:hover { background: #16a34a; border-color: #16a34a; }

        /* ==================== 3. 边缘感应区 ==================== */
        .edge-sensor-zone {
            position: fixed;
            top: 0;
            right: 0;
            width: 12px;
            height: 100vh;
            z-index: 998;
            cursor: pointer;
        }
        .edge-sensor-zone:hover {
            background: linear-gradient(to left, rgba(74, 222, 128, 0.3), transparent);
        }

        /* ==================== 4. 抽屉主面板 ==================== */
        .drawer-container {
            position: fixed;
            top: 0;
            right: 0;
            width: 480px;
            height: 100vh;
            background: var(--bg-drawer);
            backdrop-filter: var(--blur-drawer);
            -webkit-backdrop-filter: var(--blur-drawer);
            box-shadow: var(--shadow-drawer);
            border-left: var(--border-drawer);
            display: flex;
            flex-direction: column;
            z-index: 999;
            transform: translateX(100%);
            transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .drawer-container.expanded,
        .drawer-container:hover,
        .drawer-container.pinned {
            transform: translateX(0) !important;
        }

        /* ---------- 顶部 Header ---------- */
        .drawer-header {
            padding: 12px 18px 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: var(--border-bottom-subtle);
            background: var(--bg-header);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-leaf-icon {
            width: 24px;
            height: 24px;
            border-radius: 7px;
            background: linear-gradient(135deg, #22c55e, #15803d);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(21, 128, 61, 0.25);
        }

        .header-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.2px;
        }

        .header-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 10px;
            background: rgba(22, 163, 74, 0.1);
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.7);
            color: var(--primary);
        }

        .action-btn.active, .action-btn.pinned-active {
            color: var(--primary);
            background: rgba(22, 163, 74, 0.12);
        }

        /* ---------- 分类 Tab 栏 + 过滤与排序 ---------- */
        .category-tab-bar {
            display: flex;
            align-items: center;
            padding: 6px 14px;
            gap: 4px;
            border-bottom: var(--border-bottom-subtle);
            background: var(--bg-tabbar);
            flex-shrink: 0;
            overflow: hidden;
        }

        .tab-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .tab-item:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.5);
        }

        .tab-item.active {
            background: var(--tab-active-bg);
            color: var(--primary);
            box-shadow: var(--tab-active-shadow);
        }

        .tab-count {
            font-size: 10px;
            opacity: 0.8;
            padding: 0 4px;
            border-radius: 6px;
            background: rgba(22, 163, 74, 0.08);
            color: var(--primary);
        }

        .filter-box {
            margin-left: auto;
            width: 88px;
            font-size: 11px;
            padding: 4px 7px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
            transition: width 0.15s ease, border-color 0.15s ease;
        }
        .filter-box:focus {
            width: 108px;
            border-color: var(--primary);
            background: #ffffff;
        }

        .sort-box {
            font-size: 11px;
            padding: 4px 5px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-sub);
            outline: none;
            cursor: pointer;
        }

        /* ---------- 内容滚动区域 ---------- */
        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .drawer-content::-webkit-scrollbar { width: 5px; }
        .drawer-content::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 4px;
        }

        /* ---------- 抽屉分组 (高质感纯净微线分隔) ---------- */
        .section-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px;
            cursor: pointer;
            background: transparent;
        }

        .section-title-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .section-grip {
            cursor: grab;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.15s;
            margin-right: 2px;
        }
        .section-header:hover .section-grip { opacity: 0.8; }

        .toggle-arrow {
            width: 13px;
            height: 13px;
            transition: transform 0.2s ease;
            color: var(--text-muted);
        }

        .section-group.collapsed .toggle-arrow {
            transform: rotate(-90deg);
        }

        /* 通透微光微线 (已移除刺眼的高饱和绿，恢复柔和自然的微线光感) */
        .section-divider-line {
            flex: 1;
            height: 1px;
            background: var(--divider-gradient);
            margin: 0 10px;
        }

        .section-count {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* ---------- 4 列文件网格 (精品 Apple/Mac 式图标色彩) ---------- */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .section-group.collapsed .file-grid {
            display: none;
        }

        .file-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 4px 6px 4px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            width: 100%;
        }

        .file-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-card-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-card-hover);
            z-index: 2;
        }

        .file-card.selected {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .file-card.stale {
            opacity: 0.45;
            filter: grayscale(0.85);
        }
        .file-card.stale:hover {
            opacity: 0.92;
            filter: grayscale(0.15);
        }

        /* 置顶星标 & MD链接 */
        .pin-star, .card-link {
            position: absolute;
            top: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            color: var(--text-muted);
            font-size: 10.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 3;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            border: none;
        }

        .pin-star { right: 8px; }
        .card-link { right: 30px; }

        .file-card:hover .pin-star,
        .file-card:hover .card-link {
            opacity: 1;
        }

        .pin-star.pinned {
            opacity: 1;
            color: #d97706;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(217, 119, 6, 0.25);
        }

        .card-checkbox {
            position: absolute;
            top: 4px;
            left: 8px;
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 1.5px solid var(--text-muted);
            background: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            z-index: 3;
        }

        .select-mode .card-checkbox { display: flex; }
        .file-card.selected .card-checkbox {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        /* 58x58 高级质感圆角 Squircle 图标 */
        .file-thumb-box {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            position: relative;
            border-radius: 13px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .file-card:hover .file-thumb-box {
            transform: scale(1.04);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
        }

        .file-thumb-box img,
        .file-thumb-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-play-badge {
            position: absolute;
            right: 4px;
            bottom: 4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .file-icon-svg {
            width: 100%;
            height: 100%;
        }

        .file-title {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-main);
            width: 100%;
            max-width: 92px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            line-height: 1.35;
        }

        .file-meta {
            font-size: 9.5px;
            color: var(--text-muted);
            margin-top: 1px;
            font-weight: 500;
        }

        /* ---------- 📋 花笺便签墙 ---------- */
        .note-wall-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .floral-note-card {
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 190px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .floral-note-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .note-theme-matcha {
            background: rgba(244, 252, 245, 0.95);
            border-color: #bbf7d0;
            color: #14532d;
        }
        .note-theme-sakura {
            background: rgba(255, 245, 246, 0.95);
            border-color: #fecdd3;
            color: #881337;
        }

        .note-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.1);
            padding-bottom: 5px;
        }

        .note-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.05);
            font-weight: 600;
        }

        .note-md-view {
            font-size: 11.5px;
            line-height: 1.6;
            flex: 1;
            overflow: auto;
        }
        .note-md-view h4 { font-size: 12px; margin-bottom: 4px; }
        .note-md-view code {
            font-family: var(--font-mono);
            font-size: 10.5px;
            background: rgba(0, 0, 0, 0.05);
            padding: 1px 4px;
            border-radius: 4px;
        }

        .floral-add-card {
            border: 1.5px dashed #86efac;
            background: rgba(240, 253, 244, 0.4);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--primary);
            min-height: 190px;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .floral-add-card:hover {
            background: rgba(240, 253, 244, 0.85);
            transform: translateY(-2px);
        }

        /* ---------- 悬浮气泡预览 ---------- */
        .preview-overlay {
            position: absolute;
            inset: 0;
            z-index: 100;
            pointer-events: none;
        }

        .preview-window {
            position: absolute;
            pointer-events: none;
            width: 260px;
            background: var(--preview-bg);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: popIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .preview-media-box {
            height: 140px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .preview-media-box img, .preview-media-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-text-content {
            padding: 10px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-main);
            white-space: pre-wrap;
            max-height: 140px;
            overflow: hidden;
        }
        .preview-footer-name {
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);

            { id: 'f5', name: '草木绿护眼规范.pdf', kind: 'doc', ext: 'pdf', drawer: '🎨 视觉方案', pinned: false, openCount: 6, size: 1850000, mtime: '2026-09-03 16:20', stale: false, previewType: 'text', previewContent: 'PDF: Eye-Care Color Tokens & Botanical Aesthetics' },
            { id: 'f6', name: '花笺拟物组件.fig', kind: 'doc', ext: 'fig', drawer: '🎨 视觉方案', pinned: false, openCount: 3, size: 3400000, mtime: '2026-09-03 14:00', stale: false, previewType: 'text', previewContent: 'Figma: Floral Notepaper Stationery Components' },
            { id: 'f7', name: '晨雾壁纸_4K.png', kind: 'image', ext: 'png', drawer: '🎨 视觉方案', pinned: false, openCount: 7, size: 890000, mtime: '2026-09-02 20:10', stale: false, thumb: 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=200&q=80', previewType: 'image', previewContent: 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=600&q=80' },
            { id: 'f8', name: '自然呼吸动效.txt', kind: 'doc', ext: 'txt', drawer: '🎨 视觉方案', pinned: false, openCount: 2, size: 4200, mtime: '2026-09-02 09:30', stale: false, previewType: 'text', previewContent: '1. 叶脉柔和淡入 180ms\n2. 气泡微浮呼吸' },

            // 组 3：🍃 个人与灵感 (4 项)
            { id: 'f9', name: '植树计划清单.xlsx', kind: 'doc', ext: 'xlsx', drawer: '🍃 个人与灵感', pinned: false, openCount: 5, size: 142000, mtime: '2026-09-03 15:40', stale: false, previewType: 'text', previewContent: '计划表' },
            { id: 'f10', name: '植物图鉴笔记.md', kind: 'doc', ext: 'md', drawer: '🍃 个人与灵感', pinned: false, openCount: 3, size: 1200, mtime: '2026-09-03 11:00', stale: false, previewType: 'text', previewContent: '### 罗汉松\n四季常青，生机盎然。' },
            { id: 'f11', name: '茶室配置.txt', kind: 'doc', ext: 'txt', drawer: '🍃 个人与灵感', pinned: false, openCount: 1, size: 5400, mtime: '2026-08-10 09:12', stale: true, previewType: 'text', previewContent: 'TEMP=24\nLIGHT=warm_green' },
            { id: 'f12', name: '随手灵感速记.txt', kind: 'doc', ext: 'txt', drawer: '🍃 个人与灵感', pinned: false, openCount: 2, size: 3800, mtime: '2026-08-08 16:30', stale: true, previewType: 'text', previewContent: '1. 尝试将便签渲染为古法花笺纸\n2. 降低强光反射' }
        ];

        let archiveFiles = [
            { id: 'a1', name: '旧版需求草稿_0715.docx', size: '18 KB' },
            { id: 'a2', name: '废弃录屏片段_0720.mp4', size: '32 MB' }
        ];

        // 🌸 花笺便签数据
        let mockNotes = [
            { id: 'n1', title: '🍃 抹茶花笺 · 今日随手记', theme: 'note-theme-matcha', tag: '茶笺', content: '#### 今日花笺待办\n- [x] 调配草绿护眼自然调色盘\n- [x] 引入花笺拟物便签纸样式\n- [ ] 享受自然舒缓的视觉流动' },
            { id: 'n2', title: '🌸 樱落花笺 · 灵感撷取', theme: 'note-theme-sakura', tag: '花笺', content: '#### 诗意备忘\n> *草木有本心，何求美人折。*\n\n1. 纯文本轻量编辑\n2. 诗意 Markdown 排版' }
        ];

        let currentTab = 'all';
        let filterKeyword = '';
        let sortMode = 'time';
        let isPinned = false;
        let selectMode = false;
        let selectedFileIds = new Set();
        let collapsedGroups = new Set();
        let staleEnabled = true;
        let currentTheme = 'nature-glass';

        let hoverTimer = null;
        let peekCloseTimer = null;

        window.addEventListener('DOMContentLoaded', () => {
            render();
            setupSensors();
        });

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);

            document.getElementById('btnThemeNatureGlass').classList.toggle('active', theme === 'nature-glass');
            document.getElementById('btnThemeNatureSolid').classList.toggle('active', theme === 'nature-solid');
            document.getElementById('themeSelect').value = theme;

            showToast(theme === 'nature-glass' ? '🍃 已切换至【晨露薄竹 (透光毛玻璃)】' : '🍵 已切换至【润目温茶 (润目实色)】');
        }

        function toggleThemeQuick() {
            setTheme(currentTheme === 'nature-glass' ? 'nature-solid' : 'nature-glass');
        }

        function setWallpaper(type, btn) {
            document.querySelectorAll('.wp-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.body.style.backgroundImage = `url('${wallpapers[type]}')`;
        }

        function setupSensors() {
            const sensor = document.getElementById('edgeSensor');
            const drawer = document.getElementById('drawerContainer');

            sensor.addEventListener('mouseenter', () => drawer.classList.add('expanded'));
            drawer.addEventListener('mouseleave', () => {
                if (!isPinned) {
                    drawer.classList.remove('expanded');
                    closePeek();
                }
            });
        }

        function toggleDrawer() {
            document.getElementById('drawerContainer').classList.toggle('expanded');
        }

        function togglePin() {
            isPinned = !isPinned;
            const drawer = document.getElementById('drawerContainer');
            const pinBtn = document.getElementById('pinBtn');
            drawer.classList.toggle('pinned', isPinned);
            pinBtn.classList.toggle('pinned-active', isPinned);
            showToast(isPinned ? '📌 面板已固定' : '移出自动收起');
        }

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            if (element) element.classList.add('active');

            const isBoard = tab === 'whiteboard';
            document.getElementById('fileSectionsContainer').style.display = isBoard ? 'none' : 'block';
            document.getElementById('whiteboardContainer').style.display = isBoard ? 'block' : 'none';

            render();
        }

        function handleSearch(val) {
            filterKeyword = val.trim().toLowerCase();
            render();
        }

        function handleSort(mode) {
            sortMode = mode;
            render();
        }

        function sortItems(list) {
            const pin = (a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
            if (sortMode === 'name') return [...list].sort((a, b) => pin(a, b) || a.name.localeCompare(b.name, 'zh'));
            if (sortMode === 'size') return [...list].sort((a, b) => pin(a, b) || b.size - a.size);
            if (sortMode === 'frequent') return [...list].sort((a, b) => pin(a, b) || b.openCount - a.openCount);
            return [...list].sort((a, b) => pin(a, b) || b.mtime.localeCompare(a.mtime));
        }

        function render() {
            updateBadges();

            if (currentTab === 'whiteboard') {
                renderWhiteboard();
                return;
            }

            let visibleFiles = mockFiles.filter(f => {
                const matchTab = (currentTab === 'all') || (f.kind === currentTab);
                const matchKeyword = !filterKeyword || f.name.toLowerCase().includes(filterKeyword) || f.drawer.toLowerCase().includes(filterKeyword);
                return matchTab && matchKeyword;
            });

            const groupsMap = {};
            visibleFiles.forEach(f => {
                const d = f.drawer || '未分类';
                if (!groupsMap[d]) groupsMap[d] = [];
                groupsMap[d].push(f);
            });

            const container = document.getElementById('fileSectionsContainer');
            container.innerHTML = '';

            const drawerNames = ['🌿 核心项目', '🎨 视觉方案', '🍃 个人与灵感'];

            drawerNames.forEach(dName => {
                const items = groupsMap[dName] || [];
                if (items.length === 0 && filterKeyword) return;

                const isCollapsed = collapsedGroups.has(dName);
                const secEl = document.createElement('div');
                secEl.className = `section-group ${isCollapsed ? 'collapsed' : ''}`;

                const sortedItems = sortItems(items);

                secEl.innerHTML = `
                    <div class="section-header" onclick="toggleSection('${dName}')">
                        <div class="section-title-box">
                            <span class="section-grip" title="拖拽排序">⠿</span>
                            <svg class="toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            <span>${dName}</span>
                        </div>
                        <div class="section-divider-line"></div>
                        <span class="section-count">${items.length} 项</span>
                    </div>
                    <div class="file-grid">
                        ${sortedItems.map(item => renderFileCardHtml(item)).join('')}
                    </div>
                `;

                container.appendChild(secEl);
            });

            bindCardEvents();
        }

        // 精品 Apple / Mac 风格专业配色 Squircle 图标 (告别杂乱刺眼)
        function renderFileCardHtml(it) {
            const isStale = staleEnabled && it.stale;
            const isSelected = selectedFileIds.has(it.id);

            let thumbHtml = '';
            if (it.kind === 'image') {
                thumbHtml = `<img src="${it.thumb}" alt="${it.name}">`;
            } else if (it.kind === 'video') {
                thumbHtml = `<img src="${it.thumb}" alt="${it.name}"><div class="video-play-badge">▶</div>`;
            } else {
                let grad = 'linear-gradient(135deg, #3b82f6, #1d4ed8)', label = 'DOC';
                if (it.ext === 'pdf') { grad = 'linear-gradient(135deg, #f43f5e, #e11d48)'; label = 'PDF'; }
                if (it.ext === 'xlsx') { grad = 'linear-gradient(135deg, #10b981, #059669)'; label = 'XLS'; }
                if (it.ext === 'txt') { grad = 'linear-gradient(135deg, #64748b, #475569)'; label = 'TXT'; }
                if (it.ext === 'md') { grad = 'linear-gradient(135deg, #8b5cf6, #6d28d9)'; label = 'MD'; }
                if (it.ext === 'fig') { grad = 'linear-gradient(135deg, #a855f7, #7c3aed)'; label = 'FIG'; }

                thumbHtml = `
                    <svg class="file-icon-svg" viewBox="0 0 64 64" fill="none">
                        <defs>
                            <linearGradient id="grad_${it.id}" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="${grad.split(', ')[1]}"/>
                                <stop offset="100%" stop-color="${grad.split(', ')[2].replace(')', '')}"/>
                            </linearGradient>
                        </defs>
                        <rect width="64" height="64" rx="14" fill="url(#grad_${it.id})"/>
                        <text x="32" y="39" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">${label}</text>
                    </svg>
                `;
            }

            return `
                <div class="file-card ${isStale ? 'stale' : ''} ${isSelected ? 'selected' : ''}" data-id="${it.id}">
                    <div class="card-checkbox">${isSelected ? '✓' : ''}</div>
                    <button class="card-link" title="复制 Markdown 引用链接" onclick="copyMdLink(event, '${it.name}')">🔗</button>
                    <button class="pin-star ${it.pinned ? 'pinned' : ''}" title="${it.pinned ? '取消置顶' : '置顶'}" onclick="togglePinFile(event, '${it.id}')">
                        ${it.pinned ? '★' : '☆'}
                    </button>
                    <div class="file-thumb-box">${thumbHtml}</div>
                    <div class="file-title" title="${it.name}">${it.name}</div>
                    <div class="file-meta">${fmtSize(it.size)}</div>
                </div>
            `;
        }

        // 🌸 花笺便签墙渲染
        function renderWhiteboard() {
            const container = document.getElementById('whiteboardContainer');
            container.innerHTML = `
                <div class="note-wall-grid">
                    ${mockNotes.map(n => `
                        <div class="floral-note-card ${n.theme}" onclick="showToast('已打开花笺独立窗口: ${n.title}')">
                            <div class="note-header">
                                <span>${n.title}</span>
                                <span class="note-tag">${n.tag}</span>
                            </div>
                            <div class="note-md-view">
                                ${n.content.replace(/#### (.*)/g, '<h4>$1</h4>').replace(/- \[x\] (.*)/g, '<div>✓ $1</div>').replace(/- \[ \] (.*)/g, '<div>○ $1</div>').replace(/blockquote/g, 'blockquote').replace(/\n/g, '<br>')}
                            </div>
                        </div>
                    `).join('')}
                    <div class="floral-add-card" onclick="createNewNote()">
                        <span style="font-size: 20px;">🌸</span>
                        <span style="font-size: 11.5px; font-weight: 700;">采撷新花笺</span>
                    </div>
                </div>
            `;
        }

        function fmtSize(bytes) {
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
            if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return bytes + ' B';
        }

        function bindCardEvents() {
            const cards = document.querySelectorAll('.file-card');
            cards.forEach(card => {
                const id = card.dataset.id;
                const file = mockFiles.find(f => f.id === id);

                card.addEventListener('click', (e) => {
                    if (e.target.closest('.pin-star') || e.target.closest('.card-link')) return;
                    if (selectMode) {
                        if (selectedFileIds.has(id)) selectedFileIds.delete(id);
                        else selectedFileIds.add(id);
                        updateSelectBar();
                        render();
                    } else {
                        showToast(`已调用系统默认程序打开: ${file.name}`);
                    }
                });

                card.addEventListener('mouseenter', () => {
                    if (selectMode) return;
                    clearTimeout(hoverTimer);
                    clearTimeout(peekCloseTimer);
                    hoverTimer = setTimeout(() => showPeek(file, card), 450);
                });

                card.addEventListener('mouseleave', () => {
                    clearTimeout(hoverTimer);
                    peekCloseTimer = setTimeout(() => closePeek(), 150);
                });
            });
        }

        function showPeek(file, cardEl) {
            const overlay = document.getElementById('previewOverlay');
            const win = document.getElementById('previewWindow');
            const mediaBox = document.getElementById('previewMedia');
            const nameText = document.getElementById('previewNameText');
            const tagText = document.getElementById('previewTagText');

            nameText.innerText = file.name;
            tagText.innerText = file.kind.toUpperCase();

            if (file.previewType === 'image') {
                mediaBox.innerHTML = `<img src="${file.previewContent}">`;
            } else if (file.previewType === 'video') {
                mediaBox.innerHTML = `<video src="${file.previewContent}" autoplay muted loop playsinline></video>`;
            } else {
                mediaBox.innerHTML = `<div class="preview-text-content">${file.previewContent}</div>`;
            }

            overlay.style.display = 'block';

            const cr = cardEl.getBoundingClientRect();
            const dr = document.getElementById('drawerContainer').getBoundingClientRect();
            let left = cr.left - dr.left - 270;
            if (left < 10) left = cr.right - dr.left + 10;
            let top = cr.top - dr.top - 10;
            if (top + 220 > dr.height) top = dr.height - 230;
            if (top < 10) top = 10;

            win.style.left = `${left}px`;
            win.style.top = `${top}px`;
        }

        function closePeek() {
            clearTimeout(hoverTimer);
            clearTimeout(peekCloseTimer);
            document.getElementById('previewOverlay').style.display = 'none';
        }

        function togglePinFile(e, id) {
            e.stopPropagation();
            const file = mockFiles.find(f => f.id === id);
            if (file) {
                file.pinned = !file.pinned;
                showToast(file.pinned ? `⭐ 已置顶「${file.name}」` : `已取消置顶`);
                render();
            }
        }

        function copyMdLink(e, filename) {
            e.stopPropagation();
            const isImg = filename.match(/\.(jpg|jpeg|png|gif|webp)$/i);
            const linkText = isImg ? `![${filename}](files.local/${encodeURIComponent(filename)})` : `[${filename}](files.local/${encodeURIComponent(filename)})`;
            navigator.clipboard?.writeText(linkText);
            showToast(`🔗 已复制 Markdown 链接`);
        }

        function toggleSection(name) {
            if (collapsedGroups.has(name)) collapsedGroups.delete(name);
            else collapsedGroups.add(name);
            render();
        }

        function toggleSelectMode(force) {
            selectMode = force !== undefined ? force : !selectMode;
            if (!selectMode) selectedFileIds.clear();

            document.getElementById('btnSelectMode').classList.toggle('active', selectMode);
            document.getElementById('selectBar').style.display = selectMode ? 'flex' : 'none';
            document.getElementById('drawerContainer').classList.toggle('select-mode', selectMode);
            updateSelectBar();
            render();
        }

        function updateSelectBar() {
            const count = selectedFileIds.size;
            document.getElementById('btnSelDelete').innerText = `删除 (${count})`;
            document.getElementById('btnSelAll').innerText = count === mockFiles.length ? '取消全选' : '全选';
        }

        function toggleSelectAll() {
            if (selectedFileIds.size === mockFiles.length) selectedFileIds.clear();
            else mockFiles.forEach(f => selectedFileIds.add(f.id));
            updateSelectBar();
            render();
        }

        function deleteSelected() {
            if (selectedFileIds.size === 0) return;
            const count = selectedFileIds.size;
            mockFiles = mockFiles.filter(f => !selectedFileIds.has(f.id));
            selectedFileIds.clear();
            toggleSelectMode(false);
            showToast(`🗑️ 已将 ${count} 项移入回收站`);
        }

        function moveSelected() {
            if (selectedFileIds.size === 0) return;
            const target = document.getElementById('selTargetDrawer').value;
            mockFiles.forEach(f => {
                if (selectedFileIds.has(f.id)) f.drawer = target;
            });
            const count = selectedFileIds.size;
            selectedFileIds.clear();
            toggleSelectMode(false);
            showToast(`📦 已将 ${count} 项移入「${target || '根目录'}」`);
        }

        function toggleArchivePanel(force) {
            const panel = document.getElementById('archivePanel');
            const isOpen = force !== undefined ? force : panel.style.display === 'none';
            panel.style.display = isOpen ? 'flex' : 'none';
            document.getElementById('btnArchivePanelToggle').innerText = isOpen ? '归档 ▼' : '归档 ▲';
            if (isOpen) renderArchiveList();
        }

        function renderArchiveList() {
            const container = document.getElementById('archiveListContainer');
            document.getElementById('archiveTotalText').innerText = archiveFiles.length;
            container.innerHTML = archiveFiles.map((f, i) => `
                <div class="archive-row">
                    <span style="font-weight: 500;">${f.name}</span>
                    <div style="display:flex; gap:4px;">
                        <button class="archive-mini-btn" onclick="restoreArchive(${i})">移回</button>
                        <button class="archive-mini-btn" style="color:#dc2626;" onclick="deleteArchiveItem(${i})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function quickArchiveStale() {
            const staleItems = mockFiles.filter(f => f.stale);
            if (staleItems.length === 0) return;
            staleItems.forEach(item => archiveFiles.push({ id: 'a_' + Date.now(), name: item.name, size: fmtSize(item.size) }));
            mockFiles = mockFiles.filter(f => !f.stale);
            showToast(`📦 已一键将 ${staleItems.length} 个过期项归档`);
            render();
        }

        function restoreArchive(index) {
            const item = archiveFiles.splice(index, 1)[0];
            mockFiles.push({ id: 'f_' + Date.now(), name: item.name, kind: 'doc', ext: 'docx', drawer: '🌿 核心项目', pinned: false, openCount: 1, size: 20000, mtime: '2026-09-04 01:00', stale: false, previewType: 'text', previewContent: '恢复文件' });
            renderArchiveList();
            render();
            showToast(`已移回「${item.name}」`);
        }

        function emptyArchive() {
            archiveFiles = [];
            renderArchiveList();
            showToast(`已清空归档`);
        }

        function toggleSettings(open) {
            document.getElementById('settingsPanel').style.display = open ? 'flex' : 'none';
        }

        function toggleStaleSetting(on) {
            staleEnabled = on;
            document.getElementById('staleBadge').style.display = on ? 'inline-block' : 'none';
            document.getElementById('btnArchiveQuick').style.display = on ? 'inline-block' : 'none';
            render();
        }

        function changeStaleDays(days) {
            document.getElementById('staleBadge').innerText = `⏳ 2项>${days}天`;
        }

        function createNewNote() {
            mockNotes.push({ id: 'n_' + Date.now(), title: '🌸 新花笺', theme: 'note-theme-matcha', tag: '新笺', content: '#### 新花笺\n在此采撷自然灵感与思路...' });
            render();
            showToast('已采撷一张新花笺');
        }

        function refreshList() {
            showToast('已完成文件列表刷新');
            render();
        }

        function updateBadges() {
            const total = mockFiles.length;
            document.getElementById('totalBadge').innerText = `${total} 项`;
            document.getElementById('tabCountAll').innerText = total;
            document.getElementById('tabCountImg').innerText = mockFiles.filter(f => f.kind === 'image').length;
            document.getElementById('tabCountVideo').innerText = mockFiles.filter(f => f.kind === 'video').length;
            document.getElementById('tabCountDoc').innerText = mockFiles.filter(f => f.kind === 'doc').length;
            document.getElementById('tabCountNote').innerText = mockNotes.length;
        }

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }
    </script>
</body>
</html>
